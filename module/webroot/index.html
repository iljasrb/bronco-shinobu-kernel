<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shinobu Battery Tuner</title>
<style>
  /* Fixed dark: matches the manager; its WebView reports the system scheme. */
  :root {
    color: #e0e0e0;
    background: #1a1a1a;
    --fg: #e0e0e0;
    --muted: #999;
    --border: #3a3a3a;
    --border-strong: #555;
    --accent: #58a6ff;
    --accent-bg: #1c2733;
    --danger: #f85149;
    --code-bg: #2b2b2b;
  }
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body {
    margin: 0 auto;
    max-width: 720px;
    padding: 1rem 1rem 3rem;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg, #1a1a1a);
    color: var(--fg);
  }
  h1 {
    margin: 0 0 .25rem;
    font-size: 1.5rem;
    font-weight: 600;
  }
  .intro {
    margin: 0 0 1rem;
    padding-bottom: .75rem;
    color: var(--muted);
    font-size: .9rem;
  }
  .eyebrow {
    margin: 0 0 .25rem;
    color: var(--muted);
    font-size: .8rem;
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  section { border-top: 1px solid var(--border); padding: 1rem 0; }
  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    padding: .3rem 0;
    font-size: .9rem;
  }
  .status-row > span:first-child { color: var(--muted); }
  .target { color: var(--muted); margin-left: .5rem; }
  .target.diff { color: var(--accent); }        /* target lower than current */
  .target.higher { color: #e8930c; }            /* target higher than current */
  .profiles { display: flex; gap: .5rem; flex-wrap: wrap; }
  button {
    font: inherit;
    color: var(--accent);
    background: var(--bg, #1a1a1a);
    border: 1px solid var(--border-strong);
    border-radius: 2px;
    padding: .4rem .65rem;
    cursor: pointer;
  }
  button.active {
    background: var(--accent-bg);
    border-color: var(--accent);
  }
  button.apply {
    width: 100%;
    margin-top: .75rem;
    padding: .6rem;
    font-weight: 600;
  }
  button:disabled { color: #6a737d; border-color: var(--border); cursor: not-allowed; }
  #msg { color: var(--danger); font-size: .85rem; min-height: 1.2em; margin-top: .5rem; }
  code { background: var(--code-bg); padding: .1rem .3rem; border-radius: 2px; }
  @media (max-width: 600px) {
    button { min-height: 44px; }
  }
</style>
</head>
<body>
  <h1>Shinobu Battery Tuner</h1>
  <p class="intro">Battery, balanced and performance profiles for the CPU, GPU and scheduler.</p>

  <section>
    <p class="eyebrow">current profile</p>
    <code id="profile-chip">loading&hellip;</code>
  </section>

  <section>
    <p class="eyebrow">status</p>
    <div class="status-row"><span>little max</span><span><code id="v-little">?</code><span class="target" id="t-little"></span></span></div>
    <div class="status-row"><span>big max</span><span><code id="v-big">?</code><span class="target" id="t-big"></span></span></div>
    <div class="status-row"><span>prime max</span><span><code id="v-prime">?</code><span class="target" id="t-prime"></span></span></div>
    <div class="status-row"><span>GPU max</span><span><code id="v-gpu">?</code><span class="target" id="t-gpu"></span></span></div>
    <div class="status-row"><span>walt up / down</span><span><code id="v-walt">?</code><span class="target" id="t-walt"></span></span></div>
  </section>

  <section>
    <p class="eyebrow">apply</p>
    <p style="color:var(--muted);font-size:.85rem;margin:0 0 .5rem">Pick a profile to see its values next to the current ones, then apply.</p>
    <div class="profiles">
      <button id="p-battery">battery</button>
      <button id="p-balanced">balanced</button>
      <button id="p-performance">performance</button>
    </div>
    <button class="apply" id="apply">Apply profile</button>
    <div id="msg"></div>
  </section>

<script>
(function () {
  'use strict';
  var ACTION = '/data/adb/modules/shinobu-battery/action.sh';
  var selected = null;
  var targets = null;

  if (!window.ksu) {
    document.getElementById('msg').textContent =
      'Not running inside KernelSU WebUI (window.ksu missing).';
    return;
  }

  function exec(command) {
    return new Promise(function (resolve, reject) {
      var cb = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e9);
      window[cb] = function (errno, stdout, stderr) {
        delete window[cb];
        if (errno !== 0) { reject(new Error(stderr || ('exit ' + errno))); }
        else { resolve(stdout); }
      };
      try { ksu.exec(command, '{}', cb); }
      catch (e) { delete window[cb]; reject(e); }
    });
  }

  function setText(id, value) { document.getElementById(id).textContent = value; }

  // Show "-> value" when the profile changes a knob.
  // Blue = lower than current, orange = higher.
  function showTarget(rowId, key, current, formatter) {
    var el = document.getElementById('t-' + rowId);
    if (!targets || !(key in targets)) { el.textContent = ''; return; }
    var value = targets[key];
    el.textContent = '\u2192 ' + formatter(value);
    var cv = parseFloat(String(current).replace(/[^\d.]/g, ''));
    var tv = parseFloat(value);
    var diff = !isNaN(cv) && !isNaN(tv) && cv !== tv;
    el.classList.toggle('diff', diff);
    el.classList.toggle('higher', diff && tv > cv);
  }

  function renderTargets() {
    if (!targets) { return; }
    showTarget('little', 'little', current('v-little'), String);
    showTarget('big', 'big', current('v-big'), String);
    showTarget('prime', 'prime', current('v-prime'), String);
    showTarget('gpu', 'gpu', current('v-gpu'), String);
    var walt = document.getElementById('t-walt');
    var currentWalt = current('v-walt').match(/\d+/g) || [];
    var waltDiff = currentWalt[0] !== targets.up ||
      currentWalt[1] !== targets.down;
    walt.textContent = '\u2192 ' + targets.up + ' / ' + targets.down + ' us';
    walt.classList.toggle('diff', waltDiff);
    walt.classList.toggle('higher', waltDiff &&
      parseFloat(targets.up) > parseFloat(currentWalt[0]));
  }

  function current(id) {
    var t = document.getElementById(id).textContent;
    return t === '?' ? '' : t;
  }

  function refresh() {
    exec('sh ' + ACTION + ' status').then(function (out) {
      var profile = /profile: (\w+)/.exec(out);
      setText('profile-chip', profile ? profile[1] : 'unknown');
      var m;
      m = /cpu0 max: (.*)/.exec(out);  if (m) setText('v-little', m[1]);
      m = /cpu4 max: (.*)/.exec(out);  if (m) setText('v-big', m[1]);
      m = /cpu7 max: (.*)/.exec(out);  if (m) setText('v-prime', m[1]);
      m = /gpu max: (.*)/.exec(out);   if (m) setText('v-gpu', m[1]);
      m = /walt up\/down: (.*)/.exec(out);
      if (m) setText('v-walt', m[1]);
      highlight(profile ? profile[1] : null);
      renderTargets();
    }).catch(function (e) { setText('msg', 'status failed: ' + e.message); });
  }

  function highlight(name) {
    ['battery', 'balanced', 'performance'].forEach(function (p) {
      document.getElementById('p-' + p).classList.toggle('active', p === name);
    });
  }

  function preview(name) {
    exec('sh ' + ACTION + ' preview ' + name).then(function (out) {
      targets = {};
      out.split('\n').forEach(function (line) {
        var eq = line.indexOf('=');
        if (eq > 0) { targets[line.slice(0, eq)] = line.slice(eq + 1); }
      });
      renderTargets();
    }).catch(function (e) { setText('msg', 'preview failed: ' + e.message); });
  }

  document.querySelectorAll('.profiles button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      selected = btn.id.slice(2);
      highlight(selected);
      setText('msg', '');
      preview(selected);
    });
  });

  document.getElementById('apply').addEventListener('click', function () {
    if (!selected) { setText('msg', 'pick a profile first'); return; }
    var btn = document.getElementById('apply');
    btn.disabled = true;
    btn.textContent = 'Applying ' + selected + '\u2026';
    setText('msg', '');
    exec('sh ' + ACTION + ' apply ' + selected).then(function () {
      targets = null;
      refresh();
    }).catch(function (e) {
      setText('msg', 'apply failed: ' + e.message);
    }).then(function () {
      btn.disabled = false;
      btn.textContent = 'Apply profile';
    });
  });

  refresh();
})();
</script>
</body>
</html>
