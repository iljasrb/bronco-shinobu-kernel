name: build

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Load project version
        id: version
        run: |
          source ./sources.env
          echo "version=$PROJECT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          source ./sources.env
          [[ "$GITHUB_REF_NAME" == "v$PROJECT_VERSION" ]] || {
            printf 'tag %s does not match project version %s\n' \
              "$GITHUB_REF_NAME" "$PROJECT_VERSION" >&2
            exit 1
          }

      - name: Check project
        run: |
          for test in scripts/test_*.py; do python3 "$test"; done

      - name: Verify pinned SUSFS patch
        run: ./scripts/refresh-susfs.sh --check

      - name: Install build dependencies
        run: |
          timeout --kill-after=30s 10m sudo apt-get -o Acquire::Retries=3 update
          timeout --kill-after=30s 10m sudo apt-get -o Acquire::Retries=3 install \
            -y --no-install-recommends bc bison cpio flex libelf-dev libssl-dev make \
            perl pkg-config python3 python-is-python3 zlib1g-dev dwarves

      - name: Sync pinned sources
        run: ./sync-sources.sh --reset

      - name: Build kernel and package boot image
        run: ./build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shinobu-build
          path: |
            out/shinobu-kernel-*.img
            out/shinobu-kernel-*.img.sha
            out/INFO.md
            out/build-manifest
            out/.config
            inputs/boot.img
          include-hidden-files: true
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.6.2
        with:
          name: shinobu-build

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          body_path: out/INFO.md
          fail_on_unmatched_files: true
          files: |
            out/shinobu-kernel-*.img
            out/shinobu-kernel-*.img.sha
            out/INFO.md
            out/build-manifest
