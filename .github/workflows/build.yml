name: build

on:
  push:
    branches: [main]
    paths: [sources.env]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    # Runs on source-manifest pushes to main. An explicitly advanced
    # PROJECT_VERSION becomes the release; otherwise bump its final component.
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        run: |
          source ./sources.env
          previous_tag="$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || true)"
          version="$PROJECT_VERSION"
          if [ -n "$previous_tag" ] && [ "$version" = "${previous_tag#v}" ]; then
            version="$(awk -F. -v OFS=. '{$(NF)++; print}' <<< "$PROJECT_VERSION")"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$version" != "$PROJECT_VERSION" ]; then
            sed -i "s/^PROJECT_VERSION=.*/PROJECT_VERSION=\"$version\"/" sources.env
            git add sources.env
            git commit -m "release: v$version"
            git push origin "HEAD:${{ github.ref }}"
          fi
          git tag "v$version"
          git push origin "v$version"

  build:
    needs: tag
    if: always() && needs.tag.result != 'failure' && !cancelled()
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Load project version
        id: version
        run: |
          source ./sources.env
          echo "version=$PROJECT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [[ "${GITHUB_REF_NAME#v}" != "${{ steps.version.outputs.version }}" ]]; then
            printf 'tag %s does not match project version %s\n' \
              "$GITHUB_REF_NAME" "${{ steps.version.outputs.version }}" >&2
            exit 1
          fi

      - name: Install build dependencies
        run: |
          timeout --kill-after=30s 10m sudo apt-get -o Acquire::Retries=3 update
          timeout --kill-after=30s 10m sudo apt-get -o Acquire::Retries=3 install \
            -y --no-install-recommends bc bison cpio flex libelf-dev libssl-dev make \
            perl pkg-config python3 python-is-python3 zlib1g-dev dwarves

      - name: Sync pinned sources
        run: ./sync-sources.sh --reset

      - name: Build kernel and package boot image
        run: ./build.sh

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shinobu-build
          path: |
            out/shinobu-kernel-*.img
            out/shinobu-kernel-*.img.sha
            out/INFO.md
            out/build-manifest

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.6.2
        with:
          name: shinobu-build
          path: out

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          body_path: out/INFO.md
          files: |
            out/shinobu-kernel-*.img
            out/shinobu-kernel-*.img.sha
            out/INFO.md
            out/build-manifest
