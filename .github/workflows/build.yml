name: build

on:
  push:
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          source ./sources.env
          if [[ "${GITHUB_REF_NAME#v}" != "$PROJECT_VERSION" ]]; then
            printf 'tag %s does not match project version %s\n' \
              "$GITHUB_REF_NAME" "$PROJECT_VERSION" >&2
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison cpio flex libelf-dev libssl-dev make perl \
            pkg-config python3 python-is-python3 zlib1g-dev dwarves

      - name: Sync pinned sources
        run: ./sync-sources.sh --reset

      - name: Build kernel and package boot image
        run: ./build.sh

      - name: Verify tuner engine self-check
        run: bash module/test/test_tune.sh

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shinobu-build
          path: |
            out/shinobu-kernel-*.img
            out/shinobu-kernel-*.img.sha
            out/shinobu-battery.zip
            out/shinobu-battery.zip.sha
            out/shinobu-battery.json
            out/INFO.md
            out/build-manifest

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: shinobu-build
          path: out

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: out/INFO.md
          files: |
            out/shinobu-kernel-*.img
            out/shinobu-kernel-*.img.sha
            out/shinobu-battery.zip
            out/shinobu-battery.zip.sha
            out/shinobu-battery.json
            out/INFO.md
            out/build-manifest
