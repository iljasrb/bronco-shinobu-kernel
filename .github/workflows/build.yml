name: build

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-tags: true

      - name: Load project version
        id: version
        run: |
          source ./sources.env
          echo "version=$PROJECT_VERSION" >> "$GITHUB_OUTPUT"
          release=false
          if [[ "$GITHUB_REF" == "refs/heads/main" && -z "$(git tag -l "v$PROJECT_VERSION")" ]]; then
            release=true
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Check project
        run: |
          for test in scripts/test_*.py; do python3 "$test"; done

      - name: Verify pinned SUSFS patch
        run: ./scripts/refresh-susfs.sh --check

      - name: Install build dependencies
        run: |
          timeout --kill-after=30s 10m sudo apt-get -o Acquire::Retries=3 update
          timeout --kill-after=30s 10m sudo apt-get -o Acquire::Retries=3 install \
            -y --no-install-recommends bc bison cpio flex libelf-dev libssl-dev make \
            perl pkg-config python3 python-is-python3 zlib1g-dev dwarves

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Sync pinned sources
        run: ./sync-sources.sh --reset

      - name: Build kernel and package boot image
        run: ./build.sh

      - name: Build BakaSU manager for the pinned commit
        env:
          KEYSTORE_B64: ${{ secrets.BAKASU_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BAKASU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BAKASU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BAKASU_KEY_PASSWORD }}
        run: ./scripts/build-manager.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shinobu-build
          path: |
            out/shinobu-kernel-*.img
            out/shinobu-kernel-*.img.sha
            out/INFO.md
            out/build-manifest
            out/.config
            out/bakasu-manager-*.apk
            inputs/boot.img
          include-hidden-files: true
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.6.2
        with:
          name: shinobu-build

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          body_path: out/INFO.md
          fail_on_unmatched_files: true
          files: |
            out/shinobu-kernel-*.img
            out/shinobu-kernel-*.img.sha
            out/bakasu-manager-*.apk
            out/INFO.md
            out/build-manifest
