name: release battery module

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: module-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Validate module release metadata
        id: release
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          manifest = json.loads(Path("module/update.json").read_text())
          version = manifest.get("version")
          if not isinstance(version, str) or re.fullmatch(r"v\d+(?:\.\d+){2,3}", version) is None:
              raise SystemExit("module/update.json has an invalid version")

          plain_version = version[1:]
          version_code = 0
          for component in plain_version.split("."):
              value = int(component)
              if value >= 100:
                  raise SystemExit("module version components must be below 100")
              version_code = version_code * 100 + value

          tag = f"battery-v{plain_version}"
          base = f"https://github.com/{os.environ['REPOSITORY']}/releases/download/{tag}"
          expected = {
              "version": version,
              "versionCode": version_code,
              "zipUrl": f"{base}/shinobu-battery.zip",
              "changelog": f"{base}/INFO.md",
          }
          if manifest != expected:
              raise SystemExit(f"module/update.json must point to {tag}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={plain_version}\n")
          PY

      - name: Require a new module tag
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          tag="battery-v$VERSION"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            printf 'module tag %s already exists\n' "$tag" >&2
            exit 1
          fi

      - name: Build module
        run: bash scripts/build-module.sh

      - name: Verify tuner engine self-check
        run: bash module/test/test_tune.sh

      - name: Write module release notes
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          previous_tag="$(git describe --tags --abbrev=0 --match 'battery-v*' HEAD^ 2>/dev/null || true)"
          {
            printf '# shinobu-battery v%s\n\n' "$VERSION"
            if [ -n "$previous_tag" ]; then
              git log --format='- %s' "$previous_tag..HEAD" -- module/
            else
              git log --format='- %s' HEAD -- module/
            fi
          } > out/INFO.md

      - name: Publish module release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: battery-v${{ steps.release.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: shinobu-battery v${{ steps.release.outputs.version }}
          body_path: out/INFO.md
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            out/shinobu-battery.zip
            out/shinobu-battery.zip.sha
            out/shinobu-battery.json
            out/INFO.md
